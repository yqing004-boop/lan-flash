apply plugin: 'com.android.application'

android {
    namespace 'com.lanflash.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lanflash.app'
        // 与参照项目一致：Android 4.4 可安装可用
        minSdk 19
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation', 'ExpiredTargetSdkVersion'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // appcompat 1.6.1 是最后一个 minSdk 14 的稳定版；1.7.x 起 minSdk 21
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
